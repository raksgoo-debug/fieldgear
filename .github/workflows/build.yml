name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cross-checks the Java against the resources before spending time on a
      # compile: registered items without models, animation names a controller
      # references that the .animation.json does not define, recipes pointing at
      # renamed items. None of those fail a build; they fail silently at runtime.
      - name: Verify resources
        run: python3 verify_mod.py

      # Uses a provisioned Gradle rather than the wrapper, so the repo does not
      # need the wrapper's binary jar committed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fieldgear-jar
          path: build/libs/*.jar
          if-no-files-found: error

